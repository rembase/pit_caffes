<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NetCafé Pitești 2000s</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Container Unic pentru Hartă -->
    <div id="map"></div>

    <!-- Sidebar-ul din Dreapta -->
    <div id="sidebar">
      <h1>NetCafé Pitești</h1>
      <p class="subtitle">
        Dă click stânga pe hartă pentru a adăuga o nouă sală.
      </p>
      <div id="form-container">
        <h2>Adaugă o sală</h2>
        <form id="cafe-form">
          <input type="hidden" id="form-lat" />
          <input type="hidden" id="form-lng" />
          <div class="form-group">
            <label>Numele Sălii</label>
            <input type="text" id="form-nume" required />
          </div>
          <div class="form-group">
            <label>Zona / Adresa</label>
            <input type="text" id="form-zona" required />
          </div>
          <div class="form-group">
            <label>Descriere</label>
            <textarea id="form-descriere" rows="3" required></textarea>
          </div>
          <div class="form-group">
            <label style="color: #00ff00">Fotografie Sală (Alege fișier)</label>
            <input type="file" id="form-imagine" accept="image/*" />
          </div>
          <div class="form-group">
            <label style="color: #00ff00; font-weight: bold"
              >Securitate: Program chat anii 2000?</label
            >
            <input
              type="text"
              id="form-antibot"
              placeholder="4 litere"
              required
            />
          </div>
          <button type="submit">Trimite</button>
          <button
            type="button"
            id="btn-anuleaza"
            style="background: #444; color: #fff; margin-top: 8px"
          >
            Anulează
          </button>
        </form>
      </div>
      <div id="lista-locatii"></div>
    </div>

    <!-- Butonul Flotant de Toggle -->
    <div id="sidebar-toggle-btn">#pitesti ▶</div>

    <!-- Scriptul Principal JS -->
    <script defer type="module" src="js/app.js"></script>
  </body>
</html>

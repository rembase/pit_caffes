        // === FIX DEFINITIV: Metoda oficială Google Maps API Loader ===

        const GOOGLE_MAPS_API_KEY = "AIzaSyDBiXqRM3nZFu702ejO1M1qHv0HN4sTpo4";

    

        // Inițializare asincronă ghidată prin Promise direct din domeniul corect Google Maps
        function loadGoogleMapsScript() {
            return new Promise((resolve, reject) => {
                if (window.google && window.google.maps) {
                    resolve(window.google.maps);
                    return;
                }
                const script = document.createElement('script');
                script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&loading=async`;
                script.async = true;
                script.defer = true;
                script.onload = () => {
                    if (window.google && window.google.maps) {
                        resolve(window.google.maps);
                    } else {
                        reject(new Error("Librăria Google Maps nu s-a putut inițializa în ferestră."));
                    }
                };
                script.onerror = () => reject(new Error("Eroare de rețea la descărcarea scriptului Google Maps."));
                document.head.appendChild(script);
            });
        }

        // Funcție globală obligatorie pentru a prinde momentul când scriptul de bază a sosit
function initMapCallback() {
    window.dispatchEvent(new Event('GoogleMapsScriptIncarcat'));
}

// 1. Injectarea scriptului de bootstrap oficial
(function() {
    const script = document.createElement('script');

    script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&callback=initMapCallback&loading=async`;

    document.head.appendChild(script);
})();

// 2. Inițializarea hărții folosind noul standard asincron importLibrary
window.addEventListener('GoogleMapsScriptIncarcat', async () => {
    try {
        // Importăm librăriile necesare conform documentației Google din 2026
        const { Map } = await google.maps.importLibrary("maps");
        const { Marker } = await google.maps.importLibrary("marker");

        // Crearea hărții (Acum constructorul Map este garantat disponibil)
        const map = new Map(document.getElementById("map"), {
            center: { lat: 44.8565, lng: 24.8697 },
            zoom: 14,
            styles: [
                { "elementType": "geometry", "stylers": [{ "color": "#212121" }] },
                { "elementType": "labels.icon", "stylers": [{ "visibility": "off" }] },
                { "elementType": "labels.text.fill", "stylers": [{ "color": "#757575" }] },
                { "elementType": "labels.text.stroke", "stylers": [{ "color": "#212121" }] },
                { "featureType": "road", "elementType": "geometry.fill", "stylers": [{ "color": "#2c2c2c" }] },
                { "featureType": "water", "elementType": "geometry.fill", "stylers": [{ "color": "#000000" }] }
            ]
        });
        // Funcție specială pentru identificarea coordonatelor exacte din Pitești
map.addListener("click", (mapsMouseEvent) => {
    const coordonateMici = mapsMouseEvent.latLng.toJSON();
    
    // Printează coordonatele direct în Consola Browserului (F12)
    console.log("Coordonate noi detectate:", coordonateMici);
    
    // Afișează un pop-up rapid pe ecran ca să le poți copia instant
    alert("Latitudine: " + coordonateMici.lat + "\nLongitudine: " + coordonateMici.lng + "\n\nCopiază-le în cod!");
});


        const listaContainer = document.getElementById("lista-locatii");
        const infoWindow = new google.maps.InfoWindow();

        locatii.forEach((loc) => {
            // Generare Marker oficial
            const marker = new Marker({
                position: loc.Coordonate,
                map: map,
                title: loc.nume
            });

            const popupContinut = `
                <div class="popup-continut">
                    <h3>${loc.nume}</h3>
                    <p><strong>Zona:</strong> ${loc.zona}</p>
                    <p>${loc.descriere}</p>
                </div>
            `;

            marker.addListener("click", () => {
                infoWindow.setContent(popupContinut);
                infoWindow.open(map, marker);
            });

            // Generare element în Sidebar
            const item = document.createElement("div");
            item.className = "locatie-item";
            item.innerHTML = `
                <div class="locatie-name">${loc.nume}</div>
                <div class="locatie-detalii">📍 ${loc.zona}</div>
            `;

            item.addEventListener("click", () => {
                map.setZoom(16);
                map.setCenter(loc.Coordonate);
                infoWindow.setContent(popupContinut);
                infoWindow.open(map, marker);
            });

            listaContainer.appendChild(item);
        });

    } catch (error) {
        console.error("Eroare la importul librăriilor Google Maps:", error);
    }
});

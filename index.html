        .locatie-item { background: #1a1a1a; padding: 14px; margin-bottom: 10px; border-radius: 6px; cursor: pointer; border-left: 4px solid #333; }
        .locatie-item:hover { background: #222; border-left-color: #00ff66; }
        .locatie-name { font-weight: bold; font-size: 15px; color: #fff; margin-bottom: 4px; }
        .locatie-detalii { font-size: 12px; color: #00ff66; }
        .popup-continut { padding: 5px; color: #222; max-width: 250px; }
        .popup-continut h3 { color: #111; font-size: 16px; border-bottom: 2px solid #00ff66; padding-bottom: 4px; margin-bottom: 6px; }

                </div>
                <div class="form-group">
                    <label>Zona / Adresa aproximativă</label>
                    <input type="text" id="form-zona" placeholder="Ex: Găvana 3, pe Eliade la nr. 20" required>
                </div>
                <div class="form-group">
                    <label>Amintiri / Descriere</label>
                    <textarea id="form-descriere" rows="3" placeholder="Ce configuratii aveau?" required></textarea>
                </div>
                <div class="form-group">
                    <label style="color: #00ff66; font-weight: bold;">Securitate: Ce program foloseam pentru chat în anii 2000?</label>
                    <input type="text" id="form-antibot" placeholder="Răspuns din 4 litere" required>
                </div>
                <button type="submit">Salvează în cloud</button>

        function initMapCallback() { window.dispatchEvent(new Event('GoogleMapsGata')); }
        
        (function() {
            const script = document.createElement('script');
            // script.src = `https://googleapis.com{GOOGLE_MAPS_API_KEY}&callback=initMapCallback&loading=async`;
            script.src = "https://maps.googleapis.com/maps/api/js?key="+GOOGLE_MAPS_API_KEY+"&callback=initMapCallback&loading=async";
            script.defer = true;
            document.head.appendChild(script);
        })();

        window.addEventListener('GoogleMapsGata', () => {
            const map = new google.maps.Map(document.getElementById("map"), {
                center: { lat: 44.8759, lng: 24.8452 }, 
                zoom: 14,
                styles: [
                    { "elementType": "geometry", "stylers": [{ "color": "#1b1b1b" }] },
                    { "elementType": "labels.icon", "stylers": [{ "visibility": "off" }] },
                    // REPARAȚIE TEXT: Am eliminat conturul gros și am lăsat doar fontul curat
                    { "elementType": "labels.text.fill", "stylers": [{ "color": "#00ff66" }] },
                    { "elementType": "labels.text.stroke", "stylers": [{ "visibility": "off" }] }, 
                    { "featureType": "road", "elementType": "geometry.fill", "stylers": [{ "color": "#2a2a2a" }] },
                    { "featureType": "water", "elementType": "geometry.fill", "stylers": [{ "color": "#050505" }] }
                ]

            });
            const infoWindow = new google.maps.InfoWindow();
            const listaContainer = document.getElementById("lista-locatii");
            let markereActive = [];
            // Continuare script index.html din Blocul 1
            function adaugaPunctPeEcran(loc) {
                const marker = new google.maps.Marker({ position: loc.Coordonate, map: map, title: loc.nume });
                markereActive.push(marker);

                const popupContinut = `<div class="popup-continut"><h3>${loc.nume}</h3><p><strong>Zona:</strong> ${loc.zona}</p><p>${loc.descriere}</p></div>`;
                marker.addListener("click", () => { infoWindow.setContent(popupContinut); infoWindow.open(map, marker); });

                const item = document.createElement("div");
                item.className = "locatie-item";
                item.innerHTML = `<div class="locatie-name">${loc.nume}</div><div class="locatie-detalii">📍 ${loc.zona}</div>`;
                item.addEventListener("click", () => { map.setZoom(16); map.setCenter(loc.Coordonate); infoWindow.setContent(popupContinut); infoWindow.open(map, marker); });
                listaContainer.appendChild(item);
            }

            db.collection("locatii").onSnapshot((snapshot) => {
                markereActive.forEach(m => m.setMap(null));
                markereActive = [];
                listaContainer.innerHTML = "";
                locatiiInitiale.forEach(loc => adaugaPunctPeEcran(loc));
                snapshot.forEach((doc) => {
                    const locDinCloud = doc.data();
                    if(!locatiiInitiale.some(l => l.nume.toLowerCase() === locDinCloud.nume.toLowerCase())) {
                        adaugaPunctPeEcran(locDinCloud);
                    }
                });
            });

            map.addListener("click", (e) => {
                const coordonate = e.latLng.toJSON();
                document.getElementById("form-lat").value = coordonate.lat;
                document.getElementById("form-lng").value = coordonate.lng;
                document.getElementById("form-container").style.display = "block";
                document.getElementById("form-nume").focus();
            });

            document.getElementById("cafe-form").addEventListener("submit", (e) => {
                e.preventDefault();
                const raspunsAntiBot = document.getElementById("form-antibot").value.trim().toLowerCase();
                if (raspunsAntiBot !== "mirc") { alert("Răspuns greșit!"); return; }

                const nouDocument = {
                    nume: document.getElementById("form-nume").value,
                    zona: document.getElementById("form-zona").value,
                    descriere: document.getElementById("form-descriere").value,
                    Coordonate: { lat: parseFloat(document.getElementById("form-lat").value), lng: parseFloat(document.getElementById("form-lng").value) }
                };

                db.collection("locatii").add(nouDocument)
                    .then(() => { document.getElementById("cafe-form").reset(); document.getElementById("form-container").style.display = "none"; })
                    .catch((err) => { alert("Eroare: " + err.message); });
            });
        });
        // Funcție globală centralizată pentru închiderea sigură a formularului
function inchideFormularLocatie() {
    const formular = document.getElementById("cafe-form");
    const container = document.getElementById("form-container");
    
    if (formular && container) {
        formular.reset();
        container.style.display = "none";
    }
}

// Înregistrare ascultător pe butonul Anulează (Garantat stabil în namespace-ul global)
const btnAnuleaza = document.getElementById("btn-anuleaza");
if (btnAnuleaza) {
    btnAnuleaza.replaceWith(btnAnuleaza.cloneNode(true)); // Curățăm eventuale legături parazite
    document.getElementById("btn-anuleaza").addEventListener("click", (e) => {
        e.preventDefault();
        inchideFormularLocatie();
    });
}

// Înregistrare ascultător pentru tasta Escape (Oprește propagarea evenimentului în hărți)
window.addEventListener("keydown", (e) => {
    if (e.key === "Escape" || e.keyCode === 27) {
        inchideFormularLocatie();
    }
});
